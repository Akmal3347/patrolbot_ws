# nav2.yaml - updated for compatibility with Nav2 (use default_bt_xml_filename and behavior_server)
amcl:
  ros__parameters:
    use_sim_time: false
    scan_topic: /scan
    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map
    update_min_d: 0.2
    update_min_a: 0.2
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    odom_model_type: diff
    kld_err: 0.05
    kld_z: 0.99
    resample_interval: 1
    min_particles: 500
    max_particles: 2000

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    max_vel_x: 0.5
    min_vel_x: -0.2
    max_vel_theta: 1.0
    min_vel_theta: -1.0
    acc_lim_x: 0.5
    acc_lim_theta: 1.0
    xy_goal_tolerance: 0.05
    yaw_goal_tolerance: 0.05
    latch_xy_goal_tolerance: true
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      critics: ["GoalDistCritic", "GoalAlignCritic", "ObstacleFootprintCritic", "PathAlignCritic", "OscillationCritic"]

      GoalDistCritic:
        type: "dwb_critics::GoalDistCritic"

      GoalAlignCritic:
        type: "dwb_critics::GoalAlignCritic"

      ObstacleFootprintCritic:
        type: "dwb_critics::ObstacleFootprintCritic"

      PathAlignCritic:
        type: "dwb_critics::PathAlignCritic"

      OscillationCritic:
        type: "dwb_critics::OscillationCritic"


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.05
      use_astar: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    # Behavior plugins available via nav2_behaviors (Spin / BackUp are examples)
    behavior_plugins: ["Spin", "BackUp"]
    Spin:
      plugin: "nav2_behaviors/Spin"
    BackUp:
      plugin: "nav2_behaviors/BackUp"

local_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_footprint
    update_frequency: 5.0
    publish_frequency: 2.0
    static_map: false
    rolling_window: true
    width: 4.0
    height: 4.0
    resolution: 0.05
    inflation_radius: 0.2
    obstacle_range: 2.5
    raytrace_range: 3.0
    robot_radius: 0.16
    plugins:
      - name: obstacle_layer
        type: "nav2_costmap_2d::ObstacleLayer"
      - name: inflation_layer
        type: "nav2_costmap_2d::InflationLayer"

global_costmap:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    update_frequency: 1.0
    publish_frequency: 0.5
    static_map: true
    rolling_window: false
    width: 10.0
    height: 10.0
    resolution: 0.05
    robot_radius: 0.16
    inflation_radius: 0.2
    plugins:
      - name: static_layer
        type: "nav2_costmap_2d::StaticLayer"
      - name: obstacle_layer
        type: "nav2_costmap_2d::ObstacleLayer"
      - name: inflation_layer
        type: "nav2_costmap_2d::InflationLayer"

bt_navigator:
  ros__parameters:
    default_nav_through_poses_bt_xml: /home/dar/patrolbot_ws1/install/nav2_bt_navigator/share/nav2_bt_navigator/behavior_trees/follow_point.xml
    default_nav_to_pose_bt_xml: /home/dar/patrolbot_ws1/install/nav2_bt_navigator/share/nav2_bt_navigator/behavior_trees/follow_point.xml

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: /home/dar/patrolbot_ws1/install/robot_maps/share/robot_maps/maps/simple_map.yaml

waypoint_follower:
  ros__parameters:
    use_sim_time: false

